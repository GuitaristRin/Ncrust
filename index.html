// 建筑面/门线/场地 (只读, 交互点开 popup)
DATA.features.forEach(function(f){
  var p = f.properties;
  if(p.kind === 'building' && f.geometry.type === 'Polygon'){
    L.polygon(f.geometry.coordinates[0].map(function(c){return [c[1],c[0]];}), {
      color:'#b45309', weight:1.5, fillColor:'#fbbf24', fillOpacity:0.10, interactive:true
    }).bindPopup('<b>'+p.name+'</b>').addTo(map);
    (p.entrances||[]).forEach(function(en){
      L.polyline(en.line.map(function(c){return [c[1],c[0]];}), {
        color: en.is_main?'#dc2626':'#2563eb', weight: en.is_main?4:2, interactive:false
      }).addTo(map);
    });
    if(p.label_latlng){
      L.circleMarker(p.label_latlng, {radius:3, color:'#111', weight:1, fillColor:'#000', fillOpacity:0.8})
        .bindPopup('<b>'+p.name+'</b>').addTo(map);
    }
  } else if(p.kind === 'pitch' && f.geometry.type === 'Polygon'){
    L.polygon(f.geometry.coordinates[0].map(function(c){return [c[1],c[0]];}), {
      color:'#15803d', weight:2, fillColor:'#86efac', fillOpacity:0.45, interactive:true
    }).bindPopup('<b>'+p.name+'</b>').addTo(map);
  } else if(p.kind === 'gate' && f.geometry.type === 'Point'){
    L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]], {
      radius:6, color:'#fff', weight:2, fillColor:'#d97727', fillOpacity:0.95
    }).bindPopup('<b>'+p.name+'</b>').addTo(map);
  }
});

// ---------- GPS 定位 ----------
var posMarker = null, accCircle = null, watchId = null;
var prev = null;

function findNearest(lat, lng){
  var best = null, bestD = 1e9;
  DATA.features.forEach(function(f){
    var p = f.properties;
    var pt = null;
    if(f.geometry.type === 'Point'){ pt = [f.geometry.coordinates[1], f.geometry.coordinates[0]]; }
    else if(p.label_latlng){ pt = p.label_latlng; }
    if(!pt) return;
    var d = Math.hypot((pt[0]-lat)*111320, (pt[1]-lng)*111320*0.803);
    if(d < bestD){ bestD = d; best = p.name; }
  });
  return best + ' (' + Math.round(bestD) + 'm)';
}

function onPos(pos){
  var lat = pos.coords.latitude, lng = pos.coords.longitude;
  var acc = pos.coords.accuracy || 0;
  var ll = [lat, lng];
  var status = document.getElementById('status');
  var line = 'GPS[' + new Date().toLocaleTimeString() + '] ' + lat.toFixed(7) + ', ' + lng.toFixed(7) + ' acc=' + Math.round(acc) + 'm';
  status.innerHTML = line + '<br/>' + status.innerHTML;
  document.getElementById('coord').textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
  document.getElementById('acc').textContent = Math.round(acc) + ' 米' + (acc < 30 ? ' (较好)' : acc < 100 ? ' (一般)' : ' (较差)');
  document.getElementById('near').textContent = findNearest(lat, lng);
  document.getElementById('mode').textContent = acc < 30 ? '高精度模式' : '标准模式';

  if(!posMarker){
    posMarker = L.circleMarker(ll, {radius:9, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1})
      .bindPopup('我的位置 (acc ' + Math.round(acc) + 'm)').addTo(map);
    accCircle = L.circle(ll, {radius:acc, color:'#3b82f6', weight:1, fillColor:'#3b82f6', fillOpacity:0.12}).addTo(map);
  } else {
    posMarker.setLatLng(ll);
    accCircle.setLatLng(ll).setRadius(acc);
  }
  if(document.getElementById('follow').checked) map.panTo(ll);
}
function onErr(err){
  document.getElementById('status').innerHTML = '定位失败: ' + err.message + '<br/>' + document.getElementById('status').innerHTML;
}

document.getElementById('start').addEventListener('click', function(){
  if(!navigator.geolocation){ document.getElementById('status').innerHTML = '浏览器不支持定位'; return; }
  watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
  document.getElementById('start').style.display = 'none';
  document.getElementById('stop').style.display = '';
  document.getElementById('status').innerHTML = '状态: 定位中...<br/>' + document.getElementById('status').innerHTML;
});
document.getElementById('stop').addEventListener('click', function(){
  if(watchId !== null) navigator.geolocation.clearWatch(watchId);
  document.getElementById('start').style.display = '';
  document.getElementById('stop').style.display = 'none';
  document.getElementById('status').innerHTML = '状态: 已停止<br/>' + document.getElementById('status').innerHTML;
});
</script>
